services:
  db:
    image: postgres:15-alpine
    container_name: postgres_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - saas_network
    restart: unless-stopped

  app:
    build: .
    container_name: register-auth-service
    ports:
      - "8007:8001"
    environment:
      DATABASE_URL: postgresql+asyncpg://admin:password@db:5432/db
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET_KEY: AOJNFOADNLAKMFANKDFOnAOLNFALS<E23roj2nroWJNijbsdfojnsdlfno2jnfowjbndfiusb9fogbsdfnsldknf
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
    depends_on:
      - db
    networks:
      - saas_network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  saas_network:
    driver: bridge
    external: true
